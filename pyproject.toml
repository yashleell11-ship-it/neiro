[project]
name = "elizabeth-voice"
version = "0.1.0"
description = "An anime character who lives on your machine, hears how you sound, and can drive your Linux desktop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "typer>=0.15",
    "rich>=14",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "faster-whisper==1.2.1",
    "ctranslate2>=4.7.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "onnxruntime>=1.30.0",
    "librosa>=1.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
    "torch>=2.14.0",
    "kokoro==0.9.4",
    "misaki[en]>=0.9.4",
]

[project.scripts]
elizabeth = "elizabeth.cli:app"

[project.optional-dependencies]
# v2's camera work. Optional because v1 is the voice loop and must not
# be made to carry a vision stack to run.
#
# Checked against rules 2 and 3 rather than assumed (docs/DECISIONS.md,
# 2026-09-19): mediapipe publishes a pure `py3-none-manylinux_2_28`
# wheel on PyPI — not a GitHub release asset, which rule 3 forbids on
# this network — and this machine's glibc 2.44 clears the 2.28 floor.
# It pulls NO torch, NO CUDA and NO TensorFlow, which is what makes it
# safe to add here at all: the runtime venv deliberately keeps a CPU
# torch build so ctranslate2's cuBLAS stays the only CUDA runtime in the
# process, and a vision dep dragging in a second one would break STT the
# same way the training venv broke on 2026-09-13.
#
# Deliberately NOT adding opencv-python-headless alongside it: mediapipe
# depends on opencv-contrib-python, and two OpenCV distributions install
# into the same `cv2` namespace and shadow each other.
vision = ["mediapipe>=1.0.1"]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-name = "elizabeth"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Kokoro needs torch. It must be the CPU build: ctranslate2 loads cuBLAS 12
# via LD_LIBRARY_PATH (see docs/DECISIONS.md 2026-09-11) and CUDA torch
# would pull a second, conflicting CUDA runtime into the same process.
# ~200 MB instead of ~3 GB, and zero CUDA surface. Training lives in
# training/, which has its own venv and its own CUDA torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

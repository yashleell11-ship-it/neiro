[project]
name = "neiro-voice"
version = "0.1.0"
description = "An anime character who lives on your machine, hears how you sound, and can drive your Linux desktop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "typer>=0.15",
    "rich>=14",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
]

[project.scripts]
neiro = "neiro.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

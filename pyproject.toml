[project]
name = "neiro-voice"
version = "0.1.0"
description = "An anime character who lives on your machine, hears how you sound, and can drive your Linux desktop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "typer>=0.15",
    "rich>=14",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "faster-whisper==1.2.1",
    "ctranslate2>=4.7.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "onnxruntime>=1.30.0",
    "librosa>=1.0.0",
]

[project.scripts]
neiro = "neiro.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-name = "neiro"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

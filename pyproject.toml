[project]
name = "elizabeth-voice"
version = "0.1.0"
description = "An anime character who lives on your machine, hears how you sound, and can drive your Linux desktop."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "typer>=0.15",
    "rich>=14",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "faster-whisper==1.2.1",
    "ctranslate2>=4.7.0",
    "nvidia-cublas-cu12>=12.9.2.10",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "onnxruntime>=1.30.0",
    "librosa>=1.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "websockets>=17.1",
    "torch>=2.14.0",
    "kokoro==0.9.4",
    "misaki[en]>=0.9.4",
]

[project.scripts]
elizabeth = "elizabeth.cli:app"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.build-backend]
module-name = "elizabeth"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# Kokoro needs torch. It must be the CPU build: ctranslate2 loads cuBLAS 12
# via LD_LIBRARY_PATH (see docs/DECISIONS.md 2026-09-11) and CUDA torch
# would pull a second, conflicting CUDA runtime into the same process.
# ~200 MB instead of ~3 GB, and zero CUDA surface. Training lives in
# training/, which has its own venv and its own CUDA torch.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

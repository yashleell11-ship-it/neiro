# Elizabeth's TRAINING environment — deliberately a separate uv project from
# the runtime at the repo root.
#
# Why separate: the runtime venv must never contain CUDA torch. ctranslate2
# (STT) loads cuBLAS 12 via LD_LIBRARY_PATH and Kokoro uses CPU-index
# torch precisely so there is no CUDA-12/13 coexistence problem on the
# machine that has to answer in under a second. Training is the opposite
# trade: it wants CUDA torch, transformers, peft, and doesn't care about
# startup time. Two venvs, zero shared CUDA surface.
#
# Same file works on the 3090 Ti box (Windows) — uv sync there too. On
# Windows, PyPI torch is CPU-only, so uncomment the cu130 index block
# below before syncing on the box.
#
#   cd training && uv sync
#   uv run python -c "import torch; print(torch.cuda.get_device_name())"

[project]
name = "elizabeth-training"
version = "0.0.1"
description = "Fine-tuning recipes for Elizabeth's STT, SER, TTS, LLM persona, wake word, and endpointer"
requires-python = ">=3.12,<3.13"
dependencies = [
  # NOT elizabeth-voice. Depending on the runtime project editably propagated
  # its `torch = { index = "pytorch-cpu" }` source into this resolution
  # and silently replaced the CUDA build — training then died on a
  # torchaudio extension load, hours after it last worked. The shared
  # pure-python modules (manifest, corpora, labels) are imported by
  # putting ../src on sys.path, which the recipes already do, and they
  # need nothing heavier than pydantic.
  "pydantic>=2",
  "torch>=2.8",
  "torchaudio",
  "transformers>=4.50",
  "datasets>=3.0",
  "peft>=0.15",
  "accelerate",
  "jiwer",                    # WER, same definition as evals/wer.py
  "soundfile",
  "librosa",
  "scikit-learn",
  "huggingface-hub",
]

[dependency-groups]
# The recipes' pure functions live in ../src and are tested by the
# runtime venv, which has no pyarrow — so the parquet-level tests in
# tests/test_stt_train.py skip there and run here instead.
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
# Explicit, so this venv's CUDA build cannot be replaced by a resolution
# happening somewhere else. `ser_train.py` also refuses to start on a CPU
# build rather than training 40x slower and calling the result a number.
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv]
package = false

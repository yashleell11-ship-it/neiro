weights_publishable = "yes"
note = "THE ONLY GENUINELY BRITISH CORPUS in the whole verified sweep, and the only one anywhere in this manifest carrying a real accent label you can filter on. 30.64 h, 17,427 clips, ~120 volunteers who SELF-IDENTIFIED their variety: Southern England 14.66 h, Northern 4.98 h, Welsh 5.44 h, Scottish 4.36 h, Midlands 1.20 h. Zero Indian-accented content. PARTIAL PULL: `allow` takes the ten UK configs and drops irish_male (0.20 GB) -- Irish English is British Isles but not British, and the point of this entry is a label that is true. UNADVERTISED VALUE: OpenSLR's dialect_info.txt says the elicitation script includes 'lines to perform tasks on a virtual assistant', and sampled rows are literally that ('Choose the voice your assistant will use to talk to you') -- in-domain text for Elizabeth, not generic read prose. THREE WARNINGS. (1) Speaker counts per config are tiny -- midlands_female is 2 women, midlands_male 3 -- and every speaker gave ~150 clips; real diversity is concentrated in southern_male + southern_female + northern_male (~18.3 h, ~71 of 120 speakers). Down-weight the small configs or the model overfits three voices. (2) There is only a train split: carve your own eval and make it SPEAKER-DISJOINT or the number is fiction. (3) 48 kHz studio-clean read speech, acoustically like VCTK -- pair with noisy/spontaneous data for real-room robustness. ShareAlike is viral over the corpus and attribution to Google + Demirsahin et al. is mandatory; whether trained weights are an adaptation is legally unsettled, and NON_PUBLISHABLE_FLAGS deliberately omits SA, so this reads 'yes' by this repo's own policy -- flip to 'unclear' for the stricter reading."

[[dataset]]

# Neiro's training-data manifest. Read by scripts/fetch_datasets.py and
# validated by src/neiro/training/manifest.py -- a licence flag that
# contradicts weights_publishable is a load error, on purpose.
#
# Every entry below was proposed by a researcher and then checked by a
# separate verifier against the Hugging Face API or the source page:
# does the id exist, is the licence string what the page actually says,
# is the access path right. Entries that failed were dropped, not
# downgraded.
#
# priority reflects Yash's stated order (2026-09-13): emotion first
# ("i want the emotional feel mainly"), Hindi second ("u have to add
# hindi"). So --tier 1 is emotion + Hindi; --tier 2 widens to the rest
# of the pipeline; --tier 3 is everything.
#
# flags: permissive | NC | ND | SA | research-only | request-required | gated | unclear
# weights_publishable: can a model trained on this be released under Apache-2.0
#
# Raw data lands in data/datasets/<name>/ (gitignored).

schema_version = 1


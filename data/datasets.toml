license = "CC BY 4.0 -- verified at four independent points: HF API cardData.license, the license:cc-by-4.0 tag, README YAML front-matter, and README 'Licensing Information' ('Public Domain, Creative Commons Attribution 4.0 International'). Full-body grep for non-commercial/research only/restrict/prohibit: ZERO hits. Upstream OpenSLR 94, Pratap et al. 2020 (arXiv:2012.03411); underlying LibriVox recordings are public domain."
flags = ["permissive"]
access = "direct"
size_gb = 70.9
hours = 4504.0
allow = ["data/train-*0-of-01416.parquet", "data/dev-*", "data/test-*", "*.md"]
weights_publishable = "yes"
note = "PARTIAL PULL: the repo is 705.18 GB (byte-confirmed three ways; note a naive single-page tree call returns only 999 of 1,420 files and undercounts to 496 GB). `allow` takes every TENTH train shard (142 of 1,416) plus dev and test. Shards are uniform at 0.496 GB / ~31.5 h, so the pattern is the budget dial: each extra 100 shards is +49.6 GB / +3,150 h. SHARD ORDER IS SPEAKER-CLUSTERED (sampled rows 0-4 were all speaker 4800, book 10003), which is why this samples ACROSS 0..1415 rather than taking a prefix -- a prefix pull is a speaker-biased subset. WHAT IT IS NOT: accent coverage. 'Predominantly American' is inference, not documentation -- README Discussion of Biases is '[More Information Needed]', there is no accent/nationality/nativeness field anywhere, and MLS applied no accent filter. It is also the SAME LibriVox pool and same read-audiobook domain as the 1,000 h librispeech-asr-corpus already on disk: 44x more of what we have, depth not breadth. Take it as permissive bulk and the budget shock absorber, not as US/UK accent data. TWO INGEST TRAPS. (1) The README 'Data Fields' section is STALE and will raise KeyError: it documents file/text/id/chapter_id, but the real schema is audio, original_path, begin_time, end_time, transcript, audio_duration, speaker_id, book_id -- the column is `transcript`, NOT `text`. (2) Audio is LOSSY OPUS, not FLAC: magic-byte scan of dev-00000 found 1,077 OggS pages, 64 OpusHead headers, zero fLaC, vendor 'libopus 1.1.2', ~35 kbps. The FLAC distribution of MLS English is ~2.4 TB and is not what this repo serves -- fine for ASR, but do not use it for vocoder or high-fidelity TTS training. CC-BY obligation: carry the Pratap et al. 2020 citation, plus the README's no-speaker-re-identification clause. DO NOT substitute facebook/multilingual_librispeech: it tags language:en but has no english config and no english directory."

<!doctype html>
<meta charset="utf-8">
<title>Elizabeth</title>
<!-- elizabeth:token -->
<!--
  The libraries the avatar needs, served from web/vendor/ (copied out of
  node_modules by `bun add`, see README.md) — never a CDN. The demo has
  to run with Wi-Fi off. Nothing imports them unless a VRM is present;
  the drawn face needs none of this.
-->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.min.js"
  }
}
</script>
<style>
  :root { color-scheme: dark; --bg:#14141a; --fg:#e8e4df; --dim:#7d7a86; --hi:#c9a6ff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,system-ui,sans-serif;
         display:grid; grid-template-rows:1fr auto; height:100vh; }
  /* Container units, not percentages: a percentage max-height inside a
     1fr grid row does not resolve, and the face overflowed the HUD in
     any window shorter than the canvas. */
  #stage { position:relative; display:grid; place-items:center; min-height:0; overflow:hidden;
           container-type:size; }
  #stage > canvas { max-width:100cqw; max-height:100cqh; }
  #unlock { position:absolute; inset:auto auto 18px auto; }
  #hud { border-top:1px solid #2a2a34; padding:10px 14px; display:grid; gap:8px;
         grid-template-columns:auto auto 1fr auto auto; align-items:center; font-variant-numeric:tabular-nums; }
  #phase { color:var(--hi); font-weight:600; min-width:8ch; }
  #face-kind { color:var(--dim); font-size:12px; }
  #transcript { color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #queued { color:var(--dim); font-size:12px; min-width:7ch; text-align:right; }
  #meter { width:120px; height:6px; background:#2a2a34; border-radius:3px; overflow:hidden; }
  #meter > i { display:block; height:100%; width:0; background:var(--hi); transition:width .05s linear; }
  #weights { grid-column:1/-1; display:flex; gap:14px; color:var(--dim); font-size:12px; }
  #weights b { color:var(--fg); font-weight:600; }
  button { background:#2a2a34; color:var(--fg); border:0; padding:8px 14px; border-radius:6px; cursor:pointer; }
  button:hover { background:#39394a; }
</style>

<div id="stage">
  <canvas id="face" width="480" height="480"></canvas>
  <button id="unlock" hidden>click to enable sound</button>
</div>
<div id="hud">
  <span id="phase">idle</span>
  <span id="face-kind">drawn</span>
  <span id="transcript">—</span>
  <span id="queued"></span>
  <span><span id="meter"><i></i></span></span>
  <div id="weights"></div>
</div>

<script type="module">
import { AudioSink } from './src/audio.js';
import { EXPRESSIONS, ExpressionBlender, FallbackFace, VisemeScheduler } from './src/face.js';
import { loadVrm } from './src/vrm.js';
import { Transport } from './src/ws.js';

const stage = document.getElementById('stage');
const canvas = document.getElementById('face');
const el = {
  phase: document.getElementById('phase'),
  kind: document.getElementById('face-kind'),
  transcript: document.getElementById('transcript'),
  queued: document.getElementById('queued'),
  meter: document.querySelector('#meter > i'),
  weights: document.getElementById('weights'),
  unlock: document.getElementById('unlock'),
};

let face = new FallbackFace(canvas);
const visemes = new VisemeScheduler();
// Both are made on `hello`, not here: the AudioContext runs at the
// daemon's sample rate and the blender at the daemon's time constants,
// and neither number belongs in this file.
let sink = null;
let blender = null;
// utt.chunk headers waiting for their PCM. The daemon queues a chunk's
// header and PCM as ONE entry and sends them back to back, so the next
// binary frame always belongs to the first header here — a frame with
// no header waiting is not the protocol, and is refused below.
const pending = [];
let vrmAttempted = false;
let transport = null;

const setPhase = (text) => { el.phase.textContent = text; };

// --- audio -------------------------------------------------------------
function makeSink(sampleRate) {
  const s = new AudioSink(sampleRate);
  // THE metric. Reported from the audio clock, at the moment sound
  // actually began — not when we decided to send it.
  s.onstarted = (seq, at, audioId) => transport?.send({ t: 'played', seq, at, audio_id: audioId });
  s.onunderrun = (seq) => transport?.send({ t: 'underrun', seq });
  s.onended = () => { if (!pending.length) setPhase('idle'); };
  s.onstate = showUnlock;
  return s;
}
function showUnlock() { el.unlock.hidden = !sink || sink.running; }
el.unlock.onclick = () => sink?.unlock();
// Any click counts as the gesture the browser wants before it will
// make sound; the button just tells him why there is none yet.
document.addEventListener('pointerdown', () => sink?.unlock());

// --- the face, every frame --------------------------------------------
let last = performance.now() / 1000;
function frame(ms) {
  const now = ms / 1000;
  const dt = now - last;
  last = now;
  const weights = blender ? blender.step(dt) : null;
  if (weights) face.setExpression(weights);
  const m = visemes.at(sink ? sink.ctx.currentTime : now);
  face.setMouth(m.shape, m.amount);
  face.draw(now);
  hud(weights);
  requestAnimationFrame(frame);
}
function hud(weights) {
  showUnlock();
  el.queued.textContent = sink ? `${sink.queuedSeconds.toFixed(2)}s` : '';
  el.weights.textContent = '';
  for (const k of EXPRESSIONS) {
    const span = document.createElement('span');
    span.innerHTML = `${k} <b>${(weights?.[k] ?? 0).toFixed(2)}</b>`;
    el.weights.append(span);
  }
}
requestAnimationFrame(frame);

// --- messages ------------------------------------------------------------
// Every server message in src/elizabeth/server.py's SERVER_MESSAGES.
async function handle(msg) {
  switch (msg.t) {
    case 'hello': await hello(msg); break;
    case 'state':
      if (msg.phase) setPhase(msg.phase);
      if (typeof msg.level === 'number') el.meter.style.width = `${Math.min(100, msg.level * 140)}%`;
      if (msg.transcript) el.transcript.textContent = msg.transcript;
      break;
    case 'utt.begin':
      sink?.beginUtterance(msg.audio_id);
      visemes.clear();
      pending.length = 0;
      blender?.setTarget(msg.weights ?? targetFor(msg));
      setPhase('speaking');
      break;
    case 'emotion':
      blender?.setTarget(msg.weights ?? targetFor(msg));
      break;
    case 'utt.chunk':
      pending.push(msg);
      if (msg.text) el.transcript.textContent = msg.text;
      break;
    case 'utt.end':
      if (!sink?.sources.length) setPhase('idle');
      break;
    case 'cancel':
      sink?.cancel();
      visemes.clear();
      pending.length = 0;
      setPhase('idle');
      break;
  }
}

// The blender's own rule when a message carries no weights: one
// expression at the tag's intensity; neutral is all of them at rest.
function targetFor(msg) {
  const weights = {};
  if (msg.emotion && msg.emotion !== 'neutral') weights[msg.emotion] = msg.intensity ?? 0;
  return weights;
}

function binary(buffer) {
  if (!sink) return;
  const view = new DataView(buffer);
  const audioId = view.getUint32(0, true);
  const pcm = new Float32Array(buffer, 4);
  const header = pending.shift();
  if (!header || header.audio_id !== audioId) {
    // Played anyway, this PCM would be reported as the wrong seq (or
    // none) and its visemes would be some other chunk's. Refuse it and
    // say so; the daemon logs the error.
    const why = header ? `header is for reply ${header.audio_id}` : 'no utt.chunk header pending';
    transport?.send({ t: 'error', message: `audio frame for reply ${audioId} refused: ${why}` });
    return;
  }
  const startAt = sink.play(audioId, pcm, header.seq);
  if (startAt !== null && header.visemes?.length) visemes.schedule(header.visemes, startAt);
}

async function hello(msg) {
  if (!sink) sink = makeSink(msg.samplerate);
  blender = new ExpressionBlender(msg.face);
  if (msg.avatar && !vrmAttempted) {
    vrmAttempted = true;
    try {
      const vrm = await loadVrm(stage, msg.avatar);
      face = vrm;
      canvas.hidden = true;
    } catch (err) {
      console.warn('VRM not loaded; keeping the drawn face:', err);
    }
  }
  el.kind.textContent = face.kind;
  setPhase('ready');
  // Tell the daemon which expressions this face actually has —
  // `surprised` is often unbound on real VRM models, and the blender
  // redistributes rather than silently doing nothing.
  transport.send({ t: 'ready', expressions: [...face.available] });
}

// --- transport -----------------------------------------------------------
const token = window.ELIZABETH_TOKEN;
if (token) {
  transport = new Transport(token, {
    onOpen: () => setPhase('connected'),
    onClose: () => setPhase('disconnected'),
    onMessage: handle,
    onBinary: binary,
  });
  transport.connect();
} else {
  demo();
}

// --- demo ----------------------------------------------------------------
// Without this the face cannot be looked at until the whole daemon runs,
// and the face is the part most worth looking at early. The hello below
// stands in for the server's; it is the demo's only source of numbers.
function demo() {
  const DEMO_HELLO = {
    samplerate: 24000,
    face: { tau_rise_s: 0.12, tau_fall_s: 0.30, surprised_hold_s: 0.9, surprised_decay_s: 0.6,
            max_total_weight: 1.0, epsilon: 0.01 },
  };
  sink = makeSink(DEMO_HELLO.samplerate);
  blender = new ExpressionBlender(DEMO_HELLO.face);
  const steps = [
    { weights: { happy: 0.8 }, label: 'happy' },
    { weights: { surprised: 0.9 }, label: 'surprised' },
    { weights: { sad: 0.7 }, label: 'sad' },
    { weights: { angry: 0.8 }, label: 'angry' },
    { weights: { relaxed: 0.6 }, label: 'relaxed' },
    { weights: {}, label: 'neutral' },
  ];
  let i = 0;
  setInterval(() => {
    const step = steps[i++ % steps.length];
    blender.setTarget(step.weights);
    el.transcript.textContent = `demo — ${step.label}`;
    // A plausible mouth, so viseme scheduling is visible too.
    const shapes = ['aa', 'ih', 'ou', 'ee', 'oh'];
    visemes.clear();
    visemes.schedule(shapes.map((s, n) => [n * 0.16, s, 0.16]), sink.ctx.currentTime);
  }, 1800);
  setPhase('demo');
}
</script>
